name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check js/app-v3.js
          node --check js/row-play-targets.js
          node --check js/radio-reliability-v6.js
          node --check js/auralis-experience-v7.js
          node --check js/konkani-radio-v7.js
          node --check js/music-graph-v9.js
          node --check js/full-playback-v9-1.js
          node --check js/ux-reliability-v9-2.js
          node --check js/playback-recovery-v9-2-1.js
          node --check js/app-v2.js
          node --check js/collections.js
          node --check js/library-map.js
          node --check js/providers/audius.js
          node --check js/providers/jamendo.js
          node --check js/providers/radio-browser.js
          node --check js/providers/catalog-manager.js
          node --check api/radio.js
          node --check api/catalog.js
          node --check api/providers.js
          node --check api/youtube.js

      - name: Run Auralis regression suites
        run: |
          python tests/smoke.py
          python tests/radio_v6.py
          python tests/experience_v7.py
          python tests/music_graph_v9.py
          python tests/full_playback_v91.py
          python tests/ux_v92.py
          python tests/playback_recovery_v921.py